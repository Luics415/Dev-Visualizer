name: Orquestador Maestro de Seis Fases - Dev Visualizer

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecucion"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - authorized
      autorizacion:
        description: "Solo para mutaciones: AUTORIZO EJECUCION DIRECTA"
        required: false
        type: string
      instruccion:
        description: "Alcance exacto de la operacion autorizada"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  auditoria:
    name: Auditoria Automatica Read-Only
    if: ${{ github.event_name == 'schedule' || inputs.modo == 'audit' || inputs.modo == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias para validaciones
        shell: bash
        run: |
          npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit

      - name: Preparar expediente fechado
        shell: bash
        run: |
          set -euo pipefail
          fecha="$(date -u +%F)"
          run_id="${fecha//-/}-$GITHUB_RUN_ID"
          mkdir -p "docs/FechaAgente/$fecha"
          cat > "docs/FechaAgente/$fecha/00-contexto.yml" <<EOF
          id_de_ejecucion: "$run_id"
          fecha_utc: "$fecha"
          modo: auditoria_automatica
          fase: 01-definir
          entrada:
            instruccion: "Auditoria automatica programada de Dev Visualizer"
            artefacto_anterior: null
          decisiones:
            adoptadas: []
            pendientes: []
          riesgos: []
          evidencia: []
          autorizaciones_requeridas: []
          siguiente_fase: 01-definir
          EOF

      - name: Ejecutar comprobaciones sin mutar el repositorio
        shell: bash
        run: |
          set -euo pipefail
          fecha="$(date -u +%F)"
          reporte="docs/FechaAgente/$fecha/auditoria.md"
          {
            echo "# Auditoria Automatica Dev Visualizer — $fecha"
            echo
            echo "Modo: \`auditoria_automatica\` (solo lectura)."
            echo
            echo "## Estado del Repositorio"
            echo '```text'
            git status --short
            git log -5 --oneline
            echo '```'
            echo
            echo "## Validaciones Tecnicas del Atlas y Libreria"
            echo '```text'
            npm run check:library || echo "check:library con advertencias"
            npm run check:links || echo "check:links con advertencias"
            npm run check:a11y || echo "check:a11y con advertencias"
            echo '```'
            echo
            echo "## Auditoria de Dependencias"
            echo '```text'
            npm audit --audit-level=high || true
            echo '```'
            echo
            echo "## Operaciones que requieren autorizacion"
            echo "- Corregir vulnerabilidades de npm."
            echo "- Ejecutar \`npm audit fix --force\`."
            echo "- Modificar codigo fuente en \`src/\`, colecciones o rutas."
            echo "- Creacion de ramas, Pull Requests y cambios de estado en proyectos."
          } > "$reporte"

      - name: Publicar expediente
        uses: actions/upload-artifact@v4
        with:
          name: expediente-orquestador-${{ github.run_id }}
          path: docs/FechaAgente/
          if-no-files-found: error

      - name: Registrar o Actualizar Issue de Auditoria
        env:
          GH_TOKEN: ${{ secrets.LUICS_PAT || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          fecha="$(date -u +%F)"
          titulo="Auditoria del orquestador — $fecha"
          issue_number="$(gh issue list --state open --search "\"$titulo\" in:title" --json number,title --jq '.[] | select(.title == "'"$titulo"'") | .number' | head -n 1 || true)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file "docs/FechaAgente/$fecha/auditoria.md"
          else
            gh issue create --title "$titulo" --body-file "docs/FechaAgente/$fecha/auditoria.md" --label "documentation" || true
          fi

  autorizado:
    name: Ejecucion autorizada y protegida
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'authorized' && inputs.autorizacion == 'AUTORIZO EJECUCION DIRECTA' }}
    runs-on: ubuntu-latest
    environment: orchestrator-authorized
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Validar alcance autorizado
        env:
          AUTHORIZED_INSTRUCTION: ${{ inputs.instruccion }}
        shell: bash
        run: |
          set -euo pipefail
          echo "El entorno protegido debe aprobar explicitamente esta ejecucion."
          test -n "$AUTHORIZED_INSTRUCTION" || {
            echo "::error::Falta la instruccion exacta y acotada de la operacion."
            exit 1
          }
          echo "Alcance autorizado: $AUTHORIZED_INSTRUCTION"
          echo "No existe un ejecutor generico: cada mutacion debe implementarse en un paso revisado."

      - name: Publicar registro de autorizacion
        env:
          AUTHORIZED_INSTRUCTION: ${{ inputs.instruccion }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authorized-record
          printf '%s\n' \
            "# Registro de autorizacion" \
            "" \
            "- Confirmacion: \`AUTORIZO EJECUCION DIRECTA\`" \
            "- Alcance: $AUTHORIZED_INSTRUCTION" \
            "- Entorno: \`orchestrator-authorized\`" \
            "- Estado: listo para pasos revisados; no se ejecuto una mutacion generica." \
            > authorized-record/README.md

      - name: Publicar registro
        uses: actions/upload-artifact@v4
        with:
          name: autorizacion-orquestador-${{ github.run_id }}
          path: authorized-record/
