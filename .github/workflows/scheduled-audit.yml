name: Auditoría y Planificación Semanal con Copilot CLI

on:
  schedule:
    # Todos los lunes a las 08:00 UTC. Ajustar según la necesidad del proyecto.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  projects: write

jobs:
  audit-and-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Instalar GitHub CLI
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Generar reporte de estado y dependencias
        shell: bash
        run: |
          mkdir -p .reports
          {
            echo "## Estado del repositorio ($(date +'%Y-%m-%d'))"
            echo
            echo "### Auditoría de dependencias"
            if [ -f "package.json" ]; then
              npm audit --audit-level=high || true
            else
              echo "No se encontró package.json."
            fi
            if [ -f "requirements.txt" ]; then
              pip audit || true
            fi
          } > .reports/audit.md

      - name: Crear issue de planificación y auditoría
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh issue create \
            --title "Auditoría de mantenimiento y planificación: $(date +'%Y-%m-%d')" \
            --body-file .reports/audit.md \
            --label "mantenimiento"
