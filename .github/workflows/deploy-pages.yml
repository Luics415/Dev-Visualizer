name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate library catalog
        run: npm run check:library

      - name: Build static site
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY_OWNER,,}"

          if [[ "$REPOSITORY_NAME" == "$OWNER_NAME.github.io" ]]; then
            export NEXT_PUBLIC_BASE_PATH=""
            export NEXT_PUBLIC_SITE_URL="https://$OWNER_NAME.github.io"
          else
            export NEXT_PUBLIC_BASE_PATH="/$REPOSITORY_NAME"
            export NEXT_PUBLIC_SITE_URL="https://$OWNER_NAME.github.io/$REPOSITORY_NAME"
          fi

          npm run build

      - name: Validate internal links
        run: npm run check:links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
